name: Refresh FPL data

on:
  schedule:
    # Tuesdays 06:00 UTC: after Monday night games and bonus points are confirmed.
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      manager_id:
        description: "FPL manager (team) ID to start tracking on the rank chart (optional)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", "managers.json", ".github/workflows/refresh.yml"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch gameweek points
        run: python scripts/fetch_fpl.py

      - name: Fetch manager history
        env:
          MANAGER_ID: ${{ inputs.manager_id }}
        run: |
          if [ -n "$MANAGER_ID" ]; then
            if ! [[ "$MANAGER_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::manager_id must be a number, got '$MANAGER_ID'"
              exit 1
            fi
            python scripts/fetch_managers.py --add "$MANAGER_ID"
          else
            python scripts/fetch_managers.py
          fi

      - name: Commit new data
        run: |
          # Another run may have pushed since checkout. Move onto the latest main
          # (keeping this run's freshly fetched files) so the push never conflicts.
          git fetch origin main
          git reset --mixed origin/main
          git add data docs/data managers.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update FPL data $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Posts each scheduled or manual refresh to the "Weekly refresh log" issue,
  # so GitHub sends an email / app notification. Code pushes stay quiet.
  notify:
    needs: [refresh, deploy]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Find or create the refresh log issue
        id: issue
        run: |
          gh label create refresh-log --color 2a78d6 --description "Weekly data refresh notifications" 2>/dev/null || true
          num=$(gh issue list --label refresh-log --state open --limit 1 --json number --jq '.[0].number')
          if [ -z "$num" ]; then
            url=$(gh issue create --label refresh-log --assignee "${{ github.repository_owner }}" \
              --title "Weekly refresh log" \
              --body "Each weekly FPL data refresh posts a comment here. Subscribe to this issue (or keep watching the repo) to get notified. Dashboard: $PAGES_URL")
            num=${url##*/}
          fi
          echo "number=$num" >> "$GITHUB_OUTPUT"

      - name: Post success
        if: needs.refresh.result == 'success' && needs.deploy.result == 'success'
        run: |
          {
            echo "@${{ github.repository_owner }} FPL data refreshed $(date -u '+%a %d %b %Y, %H:%M UTC')"
            echo
            python scripts/refresh_summary.py
            echo
            echo "[Open the dashboard]($PAGES_URL)"
          } > body.md
          gh issue comment "${{ steps.issue.outputs.number }}" --body-file body.md

      - name: Post failure
        if: needs.refresh.result != 'success' || needs.deploy.result != 'success'
        run: |
          gh issue comment "${{ steps.issue.outputs.number }}" --body \
            "@${{ github.repository_owner }} :warning: The FPL refresh failed on $(date -u '+%a %d %b %Y'), so the dashboard was not updated. [See the run log]($RUN_URL)."
